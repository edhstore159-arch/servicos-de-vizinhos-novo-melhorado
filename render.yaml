services:
  # Backend Service
  - type: web
    name: servivizinhos-backend
    env: python
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: servivizinhos
      - key: CORS_ORIGINS
        value: "*"
    
  # Frontend Service  
  - type: web
    name: servivizinhos-frontend
    env: node
    plan: free
    buildCommand: cd frontend && yarn install && yarn build
    startCommand: cd frontend && npx serve -s build -l $PORT
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: REACT_APP_BACKEND_URL
        value: https://servivizinhos-backend.onrender.com

# Database: Use MongoDB Atlas (free tier) and add MONGO_URL in Render dashboard
